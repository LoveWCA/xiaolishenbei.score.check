<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>xiaolishenbei.score.check</title>

<style>
  /* ============================================================
     设计变量：极简瑞士风 / 等线粗体 / 浅灰细线
     ============================================================ */
  :root{
    --ink:   #1c1c1e;
    --paper: #ffffff;
    --muted: #8c8c8c;
    --soft:  #e5e5e5;
    --kai:   "KaiTi","楷体","STKaiti","Kaiti SC","SimSun","宋体",serif;
    --sans:  "Helvetica Neue", "DengXian", "等线", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.6;
    letter-spacing:.01em;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--ink); color:var(--paper); }

  button{ font-family:inherit; }
  button:focus-visible,
  input:focus-visible{ outline:1.5px solid var(--ink); outline-offset:3px; }

  /* ============================================================
     顶栏
     ============================================================ */
  .topbar{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    padding:24px 44px;
    background:var(--paper);
    border-bottom: 1px solid var(--soft);
  }
  .brand{
    font-size:15px; 
    font-weight:700; 
    letter-spacing:-0.02em;
    text-transform:lowercase;
  }
  .account-btn{
    font-size:13px; 
    letter-spacing:.1em;
    padding:8px 20px;
    background:var(--paper); color:var(--ink);
    border:1px solid var(--soft); border-radius:999px;
    cursor:pointer;
    transition:border-color .25s, background .25s, color .25s;
  }
  .account-btn:hover{ 
    border-color:var(--ink); 
    background:var(--ink);
    color:var(--paper);
  }

  /* ============================================================
     主页 Hero（超大排版）
     ============================================================ */
  .hero{
    flex:1;
    width:100%;
    max-width:1400px;
    margin:0 auto;
    padding:80px 44px 72px;
    display:flex;
    flex-direction:column;
  }

  /* 核心超大标题（复刻截图样式） */
  .greeting{
    font-size:clamp(48px, 9vw, 140px);
    line-height:1.05;
    font-weight:800;
    letter-spacing:-0.04em;
    color:var(--ink);
    padding-bottom:32px;
    border-bottom:1.5px solid var(--soft);
    word-break: break-word;
  }

  .lede{
    margin-top:40px;
    max-width:36em;
    font-size:15px;
    letter-spacing:.02em;
    color:#555;
  }

  /* 按钮：白底黑字 + 楷体 */
  .query-btn{
    margin-top:60px;
    align-self:flex-start;
    font-family:var(--kai);
    font-size:22px;
    letter-spacing:.15em;
    text-indent:.15em;
    padding:18px 56px;
    background:var(--paper);
    color:var(--ink);
    border:1.5px solid var(--ink);
    cursor:pointer;
    transition:background .25s ease, color .25s ease, transform .25s ease;
  }
  .query-btn:hover{
    background:var(--ink);
    color:var(--paper);
    transform:translateY(-2px);
  }

  /* ============================================================
     查询面板
     ============================================================ */
  .panel{
    margin-top:80px;
    padding-top:44px;
    border-top:1.5px solid var(--ink);
  }
  .panel-head{
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .panel-title{
    font-size:16px; font-weight:700; letter-spacing:.05em;
  }
  .panel-close{
    font-size:13px; color:var(--muted);
    background:none; border:none; cursor:pointer;
  }
  .panel-close:hover{ color:var(--ink); }

  .query-form{
    display:flex; align-items:flex-end; flex-wrap:wrap;
    gap:56px;
    margin-top:40px;
  }
  .field{ display:flex; flex-direction:column; gap:10px; }
  .field label{ font-size:12px; color:var(--muted); }
  .field input{
    width:180px;
    padding:8px 2px 10px;
    font-family:var(--sans);
    font-size:32px;
    font-weight:700;
    letter-spacing:-0.02em;
    color:var(--ink);
    background:transparent;
    border:none;
    border-bottom:1.5px solid var(--ink);
    outline:none;
  }
  .field input::placeholder{ color:#d8d8d8; }
  .field input:focus{ border-bottom-width:2.5px; }

  .submit-btn{
    font-size:14px; letter-spacing:.1em;
    padding:16px 42px;
    background:var(--ink); color:var(--paper);
    border:1px solid var(--ink);
    cursor:pointer;
    transition:background .25s, color .25s;
  }
  .submit-btn:hover{ background:var(--paper); color:var(--ink); }

  /* 结果区 */
  .result{ margin-top:60px; }
  .result-block{ margin-bottom:56px; }
  .result-head{
    display:flex; align-items:baseline; justify-content:space-between;
    padding-bottom:14px;
    border-bottom:1.5px solid var(--ink);
  }
  .head-label{ font-size:14px; font-weight:700; }
  .head-meta{ font-size:13px; color:var(--muted); }

  .rows{ border-bottom:1.5px solid var(--soft); }
  .row{
    display:flex; align-items:center; justify-content:space-between;
    padding:26px 4px;
    border-bottom:1px solid var(--soft);
  }
  .row:last-child{ border-bottom:none; }
  .row-rank{ font-size:30px; font-weight:800; letter-spacing:-0.02em; }
  .row-tag{
    font-size:12px; color:var(--muted);
    border:1px solid var(--soft); padding:4px 14px;
  }

  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));
    gap:1px;
    background:var(--soft);
    border:1.5px solid var(--soft);
    margin-top:20px;
  }
  .stat{ background:var(--paper); padding:26px 22px; }
  .stat-num{ font-size:44px; font-weight:800; line-height:1; letter-spacing:-0.04em; }
  .stat-lbl{ margin-top:12px; font-size:12px; color:var(--muted); }

  .empty, .hint{
    padding:44px 4px; font-size:14px; color:var(--muted);
    border-bottom:1.5px solid var(--soft);
  }

  /* 页脚 */
  .foot{
    display:flex; justify-content:space-between;
    padding:24px 44px;
    font-size:12px; color:var(--muted);
    border-top:1.5px solid var(--soft);
  }

  /* ============================================================
     弹窗设计
     ============================================================ */
  .modal{
    position:fixed; inset:0; z-index:200;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(8px);
  }
  .modal[hidden]{ display:none; }

  .modal-box{
    width:100%; max-width:780px;
    display:flex;
    background:var(--paper);
    border:1.5px solid var(--ink);
  }
  .modal-box.narrow{ max-width:480px; flex-direction:column; }

  .tabs{
    width:208px; flex:none;
    padding:32px 0;
    border-right:1.5px solid var(--soft);
  }
  .tabs-title{ padding:0 26px 22px; font-size:12px; color:var(--muted); }
  .tab{
    display:block; width:100%;
    padding:15px 26px;
    font-size:14px; text-align:left;
    color:var(--muted);
    background:none; border:none;
    border-left:2px solid transparent;
    cursor:pointer;
    transition:.2s;
  }
  .tab:hover{ background:#f9f9f9; color:var(--ink); }
  .tab.active{ color:var(--ink); font-weight:700; border-left-color:var(--ink); }

  .modal-body{ position:relative; flex:1; padding:52px 48px; min-height:440px; }
  .modal-box.narrow .modal-body{ min-height:0; padding:52px 40px 40px; }
  
  .modal-close{
    position:absolute; top:14px; right:18px;
    width:42px; height:42px; font-size:26px;
    color:var(--ink); background:none; border:none; cursor:pointer;
    transition:transform .25s;
  }
  .modal-close:hover{ transform:rotate(90deg); }

  .pane{ display:none; }
  .pane.active{ display:block; }
  .pane-title{ font-size:22px; font-weight:800; letter-spacing:-0.02em; }
  .pane-desc{ margin-top:8px; font-size:13px; color:var(--muted); }
  .pane-desc.warn{ color:#d93838; }

  .line-field{
    display:flex; align-items:center; gap:18px;
    padding:16px 0; border-bottom:1.5px solid var(--soft);
    transition:border-color .2s;
  }
  .line-field:focus-within{ border-bottom-color:var(--ink); }
  .line-field span{ flex:none; width:76px; font-size:13px; color:var(--muted); }
  .line-field input{
    flex:1; border:none; outline:none; background:transparent;
    font-family:var(--sans); font-size:16px; font-weight:600; color:var(--ink);
  }
  .line-field input::placeholder{ color:#ccc; font-weight:400; }

  .solid-btn{
    width:100%; margin-top:34px; padding:16px;
    font-size:14px; font-weight:700; letter-spacing:.1em;
    background:var(--ink); color:var(--paper);
    border:1px solid var(--ink); cursor:pointer;
    transition:.25s;
  }
  .solid-btn:hover{ background:var(--paper); color:var(--ink); }
  
  .link-line{ margin-top:20px; text-align:center; font-size:13px; color:var(--muted); }
  .link-line a{ color:var(--ink); text-decoration:underline; cursor:pointer; font-weight:700; }
  
  .info-row{ display:flex; justify-content:space-between; padding:16px 0; border-bottom:1.5px solid var(--soft); font-size:14px; }
  .info-row span:first-child{ color:var(--muted); font-size:13px; }
  .info-row span:last-child{ font-weight:700; }

  .toast{
    position:fixed; left:50%; bottom:44px; z-index:300;
    transform:translate(-50%, 18px);
    padding:14px 28px; font-size:13px; font-weight:600;
    background:var(--ink); color:var(--paper);
    opacity:0; pointer-events:none; transition:.3s;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* 响应式 */
  @media (max-width:760px){
    .topbar{ padding:20px; }
    .hero{ padding:40px 20px; }
    .greeting{ padding-bottom:20px; }
    .query-form{ gap:32px; }
    .field input{ width:130px; font-size:24px; }
    .submit-btn{ padding:14px 32px; }
    .row-rank{ font-size:24px; }
    .stat-num{ font-size:32px; }
    .foot{ flex-direction:column; gap:8px; padding:20px; }
    
    .modal-box{ flex-direction:column; max-height:88vh; overflow:auto; }
    .tabs{ width:100%; display:flex; padding:0; border-right:none; border-bottom:1.5px solid var(--soft); overflow-x:auto; }
    .tabs-title{ display:none; }
    .tab{ width:auto; white-space:nowrap; border-left:none; border-bottom:2px solid transparent; padding:16px 20px; }
    .tab.active{ border-left:none; border-bottom-color:var(--ink); }
    .modal-body{ padding:36px 24px; min-height:0; }
  }
</style>
</head>

<body>

<!-- 顶栏 -->
<header class="topbar">
  <div class="brand">xiaolishenbei.score.check</div>
  <button class="account-btn" id="accountBtn" type="button">登录</button>
</header>

<!-- 主页 -->
<main class="hero">
  <!-- 超大排版标题 -->
  <h1 class="greeting">你好，<span id="userName">访客</span></h1>
  
  <p class="lede">选择年份与月份，即可查询你在小力神杯足球赛挑战赛中的名次，并查看各项等级成绩的累计总成绩。</p>
  
  <button class="query-btn" id="queryBtn" type="button">查询我的成绩</button>

  <!-- 查询面板 -->
  <section class="panel" id="panel" hidden>
    <div class="panel-head">
      <h2 class="panel-title">成绩查询</h2>
      <button class="panel-close" id="panelClose" type="button">收起 ↑</button>
    </div>
    <form class="query-form" id="queryForm" autocomplete="off">
      <div class="field">
        <label for="year">年份</label>
        <input id="year" name="year" type="number" min="2000" max="2100" placeholder="2024" />
      </div>
      <div class="field">
        <label for="month">月份</label>
        <input id="month" name="month" type="number" min="1" max="12" placeholder="12" />
      </div>
      <button class="submit-btn" type="submit">查询</button>
    </form>
    <div class="result" id="result"></div>
  </section>
</main>

<!-- 页脚 -->
<footer class="foot">
  <span>xiaolishenbei.score.check</span>
  <span>© 2025</span>
</footer>

<!-- 登录弹窗 -->
<div class="modal" id="loginModal" hidden>
  <div class="modal-box narrow" role="dialog" aria-modal="true">
    <div class="modal-body">
      <button class="modal-close" id="loginClose" type="button">×</button>
      <h3 class="pane-title">登录</h3>
      <p class="pane-desc">使用账号和密码登录，查看你的比赛成绩。</p>
      <form id="loginForm" autocomplete="off">
        <label class="line-field"><span>账号</span>
          <input name="account" type="text" placeholder="例如：3 / loveWCA" required />
        </label>
        <label class="line-field"><span>密码</span>
          <input name="password" type="password" placeholder="请输入密码" required />
        </label>
        <button class="solid-btn" type="submit">登录</button>
      </form>
      <p class="link-line">还没有账号？<a id="toRegister">立即注册</a></p>
    </div>
  </div>
</div>

<!-- 注册弹窗 -->
<div class="modal" id="registerModal" hidden>
  <div class="modal-box narrow" role="dialog" aria-modal="true">
    <div class="modal-body">
      <button class="modal-close" id="registerClose" type="button">×</button>
      <h3 class="pane-title">注册账号</h3>
      <p class="pane-desc">创建新账号，注册后自动登录。</p>
      <form id="registerForm" autocomplete="off">
        <label class="line-field"><span>账号</span>
          <input name="account" type="text" placeholder="字母、数字、下划线" required />
        </label>
        <label class="line-field"><span>姓名</span>
          <input name="name" type="text" placeholder="请输入真实姓名" required />
        </label>
        <label class="line-field"><span>密码</span>
          <input name="password" type="password" placeholder="至少 6 位" required />
        </label>
        <label class="line-field"><span>确认密码</span>
          <input name="confirm" type="password" placeholder="再次输入密码" required />
        </label>
        <button class="solid-btn" type="submit">创建账号</button>
      </form>
      <p class="link-line">已有账号？<a id="toLogin">返回登录</a></p>
    </div>
  </div>
</div>

<!-- 账号管理弹窗 -->
<div class="modal" id="accountModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="tabs">
      <div class="tabs-title">账号管理</div>
      <button class="tab active" data-tab="info" type="button">我的账号</button>
      <button class="tab" data-tab="password" type="button">修改密码</button>
      <button class="tab" data-tab="delete" type="button">注销账号</button>
    </div>
    <div class="modal-body">
      <button class="modal-close" id="modalClose" type="button">×</button>

      <!-- 账号信息 -->
      <div class="pane active" data-pane="info">
        <h3 class="pane-title">我的账号</h3>
        <p class="pane-desc">以下是当前登录的账号信息。</p>
        <div style="margin-top:26px;">
          <div class="info-row"><span>账号</span><span id="infoAccount">—</span></div>
          <div class="info-row"><span>姓名</span><span id="infoName">—</span></div>
          <div class="info-row"><span>内部邮箱</span><span id="infoEmail" style="font-size:12px;">—</span></div>
        </div>
        <button class="solid-btn" id="logoutBtn" type="button" style="background:var(--paper);color:var(--ink);">退出登录</button>
      </div>

      <!-- 修改密码 -->
      <form class="pane" data-pane="password" id="pwdForm" autocomplete="off">
        <h3 class="pane-title">修改密码</h3>
        <p class="pane-desc">为了账号安全，建议定期更换密码。</p>
        <label class="line-field"><span>原密码</span>
          <input name="oldPwd" type="password" placeholder="请输入当前密码" required />
        </label>
        <label class="line-field"><span>新密码</span>
          <input name="newPwd" type="password" placeholder="至少 6 位" required />
        </label>
        <label class="line-field"><span>确认</span>
          <input name="confirmPwd" type="password" placeholder="再次输入新密码" required />
        </label>
        <button class="solid-btn" type="submit">保存修改</button>
      </form>

      <!-- 注销账号 -->
      <form class="pane" data-pane="delete" id="deleteForm" autocomplete="off">
        <h3 class="pane-title">注销账号</h3>
        <p class="pane-desc warn">注销后，账号与全部比赛成绩将被永久删除且无法恢复。</p>
        <label class="line-field"><span>密码</span>
          <input name="confirmPwd" type="password" placeholder="请输入登录密码" required />
        </label>
        <label class="line-field"><span>确认</span>
          <input name="confirmText" type="text" placeholder="请输入「注销」二字" required />
        </label>
        <button class="solid-btn" type="submit">永久注销账号</button>
      </form>

    </div>
  </div>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ================================================================
   ★ 配置区：填入你的 Supabase 地址与 anon key
   ================================================================ */
const SUPABASE_URL      = 'https://YOUR-PROJECT.supabase.co';   
const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY';                      
const EMAIL_SUFFIX      = '@xiaolishen.local';

const sb = (SUPABASE_URL.includes('YOUR-PROJECT') || !window.supabase)
  ? null
  : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const FORM_TEXT  = { 0:'年度', 1:'季度', 2:'月度' };
const RANK_ORDER = ['冠军','亚军','季军','殿军','第5名'];
let currentUser = null;

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const accountToEmail = (acc) => `${acc.trim()}${EMAIL_SUFFIX}`;

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(()=>el.remove(),320); }, 2200);
}
function needConfig(){ toast('请先在代码顶部填写 Supabase 的 URL 与 anon key'); }

/* 弹窗控制 */
function openModal(id){ $('#'+id).hidden = false; document.body.style.overflow='hidden'; }
function closeModal(id){ $('#'+id).hidden = true; document.body.style.overflow=''; }

$('#accountBtn').addEventListener('click', () => {
  if (!sb) return needConfig();
  if (currentUser) openModal('accountModal');
  else openModal('loginModal');
});
$('#loginClose').addEventListener('click', () => closeModal('loginModal'));
$('#registerClose').addEventListener('click', () => closeModal('registerModal'));
$('#modalClose').addEventListener('click', () => closeModal('accountModal'));
$('#toRegister').addEventListener('click', () => { closeModal('loginModal'); openModal('registerModal'); });
$('#toLogin').addEventListener('click', () => { closeModal('registerModal'); openModal('loginModal'); });

$$('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeModal(m.id); }));
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  $$('.modal').forEach(m => { if (!m.hidden) closeModal(m.id); });
});
$$('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.tab').forEach(t => t.classList.toggle('active', t === tab));
    $$('.pane').forEach(p => p.classList.toggle('active', p.dataset.pane === tab.dataset.tab));
  });
});

/* 登录 */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!sb) return needConfig();
  const fd = new FormData(e.target);
  const acc = (fd.get('account') || '').toString().trim();
  const pwd = (fd.get('password') || '').toString();
  if (!acc || !pwd) return toast('请填写账号与密码');

  try {
    const { data, error } = await sb.auth.signInWithPassword({
      email: accountToEmail(acc), password: pwd
    });
    if (error) throw error;
    currentUser = data.user;
    toast('登录成功');
    e.target.reset();
    closeModal('loginModal');
    renderAuthState();
  } catch (err) {
    toast('登录失败：' + (err.message || '账号或密码错误'));
  }
});

/* 注册 */
$('#registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!sb) return needConfig();
  const fd = new FormData(e.target);
  const acc = (fd.get('account') || '').toString().trim();
  const name = (fd.get('name') || '').toString().trim();
  const pwd = (fd.get('password') || '').toString();
  const confirm = (fd.get('confirm') || '').toString();

  if (!acc || !name || !pwd) return toast('请填写完整信息');
  if (!/^[A-Za-z0-9_]+$/.test(acc)) return toast('账号只能包含字母、数字和下划线');
  if (pwd.length < 6) return toast('密码至少 6 位');
  if (pwd !== confirm) return toast('两次输入的密码不一致');

  try {
    const { error: upErr } = await sb.auth.signUp({
      email: accountToEmail(acc), password: pwd,
      options: { data: { account: acc, name } }
    });
    if (upErr) throw upErr;

    const { data: login, error: loginErr } = await sb.auth.signInWithPassword({
      email: accountToEmail(acc), password: pwd
    });
    if (loginErr) throw loginErr;

    currentUser = login.user;
    toast('注册成功，已自动登录');
    e.target.reset();
    closeModal('registerModal');
    renderAuthState();
  } catch (err) {
    toast('注册失败：' + (err.message || '账号可能已存在'));
  }
});

/* 退出 / 修改密码 / 注销 */
$('#logoutBtn').addEventListener('click', async () => {
  if (!sb) return;
  await sb.auth.signOut();
  currentUser = null;
  toast('已退出登录');
  closeModal('accountModal');
  renderAuthState();
});

$('#pwdForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!sb) return needConfig();
  const fd = new FormData(e.target);
  const oldPwd = (fd.get('oldPwd') || '').toString();
  const newPwd = (fd.get('newPwd') || '').toString();
  const confirm = (fd.get('confirmPwd') || '').toString();

  if (newPwd.length < 6) return toast('新密码至少 6 位');
  if (newPwd !== confirm) return toast('两次输入的新密码不一致');

  try {
    const acc = currentUser.user_metadata?.account || '';
    if (acc) {
      const { error: e1 } = await sb.auth.signInWithPassword({
        email: accountToEmail(acc), password: oldPwd
      });
      if (e1) throw new Error('原密码不正确');
    }
    const { error } = await sb.auth.updateUser({ password: newPwd });
    if (error) throw error;
    toast('密码已更新');
    e.target.reset();
  } catch (err) {
    toast('修改失败：' + (err.message || ''));
  }
});

$('#deleteForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!sb) return needConfig();
  const fd = new FormData(e.target);
  const pwd = (fd.get('confirmPwd') || '').toString();
  const text = (fd.get('confirmText') || '').toString().trim();
  if (text !== '注销') return toast('请输入「注销」二字以确认');

  try {
    const acc = currentUser.user_metadata?.account || '';
    if (acc) {
      const { error: e1 } = await sb.auth.signInWithPassword({
        email: accountToEmail(acc), password: pwd
      });
      if (e1) throw new Error('密码不正确');
    }
    const { error } = await sb.rpc('delete_own_account');
    if (error) throw error;
    await sb.auth.signOut();
    currentUser = null;
    toast('账号已注销');
    e.target.reset();
    closeModal('accountModal');
    renderAuthState();
  } catch (err) {
    toast('注销失败：' + (err.message || ''));
  }
});

/* 状态渲染 */
function renderAuthState(){
  const nameEl = $('#userName');
  const btn = $('#accountBtn');

  if (currentUser){
    const name = currentUser.user_metadata?.name
              || currentUser.email?.split('@')[0] || '球友';
    nameEl.textContent = name;
    btn.textContent = '账号';
    $('#infoAccount').textContent = currentUser.user_metadata?.account || currentUser.email?.split('@')[0] || '—';
    $('#infoName').textContent = name;
    $('#infoEmail').textContent = currentUser.email || '—';
  } else {
    nameEl.textContent = '访客';
    btn.textContent = '登录';
  }
}

/* 成绩查询 */
const panel = $('#panel');
$('#queryBtn').addEventListener('click', () => {
  if (sb && !currentUser){ openModal('loginModal'); return; }
  panel.hidden = false;
  panel.scrollIntoView({ behavior:'smooth', block:'start' });
  setTimeout(() => $('#year').focus(), 380);
});
$('#panelClose').addEventListener('click', () => {
  panel.hidden = true;
  $('#queryBtn').scrollIntoView({ behavior:'smooth', block:'center' });
});

async function fetchScores(year, month){
  const { data, error } = await sb.from('scores').select('year, month, form, rank')
    .eq('user_id', currentUser.id).eq('year', year).eq('month', month)
    .order('form', { ascending: true });
  if (error) throw error;
  return data || [];
}
async function fetchTotals(){
  const { data, error } = await sb.from('totals')
    .select('champion, runner_up, third, fourth, fifth')
    .eq('user_id', currentUser.id).maybeSingle();
  if (error) throw error;
  return data || { champion:0, runner_up:0, third:0, fourth:0, fifth:0 };
}

function renderResult(year, month, rows, t){
  const totals = {
    '冠军': t.champion||0, '亚军': t.runner_up||0, '季军': t.third||0,
    '殿军': t.fourth||0, '第5名': t.fifth||0
  };
  const totalAll = RANK_ORDER.reduce((a,k)=>a+(totals[k]||0),0);

  let html = `
    <div class="result-block">
      <div class="result-head">
        <span class="head-label">查询结果</span>
        <span class="head-meta">${year} 年 ${month} 月</span>
      </div>`;
  if (!rows.length){
    html += `<div class="empty">该年月暂无成绩记录。</div>`;
  } else {
    html += `<div class="rows">`;
    rows.forEach(r => {
      html += `<div class="row">
          <span class="row-rank">${r.rank}</span>
          <span class="row-tag">${FORM_TEXT[r.form] ?? '—'}</span>
        </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;

  html += `
    <div class="result-block">
      <div class="result-head">
        <span class="head-label">总成绩统计</span>
        <span class="head-meta">全部赛事累计</span>
      </div>
      <div class="stats">
        ${RANK_ORDER.map(k=>`
          <div class="stat">
            <div class="stat-num">${totals[k]}</div>
            <div class="stat-lbl">${k}</div>
          </div>`).join('')}
        <div class="stat">
          <div class="stat-num">${totalAll}</div>
          <div class="stat-lbl">合计</div>
        </div>
      </div>
    </div>`;
  $('#result').innerHTML = html;
}

$('#queryForm').addEventListener('submit', async e => {
  e.preventDefault();
  const year  = parseInt($('#year').value, 10);
  const month = parseInt($('#month').value, 10);
  const box   = $('#result');

  if (!year || year < 2000 || year > 2100){
    box.innerHTML = `<p class="hint">请输入有效的年份（如 2024）。</p>`; return;
  }
  if (!month || month < 1 || month > 12){
    box.innerHTML = `<p class="hint">请输入有效的月份（1–12）。</p>`; return;
  }
  if (!sb){ box.innerHTML = `<p class="hint">请先在代码顶部填写 Supabase 配置。</p>`; return; }
  if (!currentUser){ box.innerHTML = `<p class="hint">请先登录后再查询。</p>`; return; }

  box.innerHTML = `<p class="hint">查询中…</p>`;
  try {
    const [rows, totals] = await Promise.all([fetchScores(year, month), fetchTotals()]);
    renderResult(year, month, rows, totals);
  } catch (err) {
    box.innerHTML = `<p class="hint">查询失败：${err.message || err}</p>`;
  }
});

/* 初始化 */
(async function init(){
  $('#year').placeholder  = String(new Date().getFullYear());
  $('#month').placeholder = String(new Date().getMonth() + 1);

  if (sb){
    const { data: { session } } = await sb.auth.getSession();
    currentUser = session?.user ?? null;
    sb.auth.onAuthStateChange((_e, s) => {
      currentUser = s?.user ?? null;
      renderAuthState();
    });
  }
  renderAuthState();
})();
</script>
</body>
</html>
