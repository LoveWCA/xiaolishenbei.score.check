<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>xiaolishenbei.score.check</title>

<style>
  /* ============================================================
     极简白底黑字设计规范
     ============================================================ */
  :root {
    --ink: #111111;
    --paper: #ffffff;
    --muted: #888888;
    --line: #e2e2e2;
    --kai: "KaiTi", "楷体", "STKaiti", "SimSun", "宋体", serif;
    --sans: "Helvetica Neue", "DengXian", "等线", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  /* ============================================================
     顶栏
     ============================================================ */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 40px;
  }

  .brand {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-transform: lowercase;
  }

  .account-btn {
    font-size: 13px;
    padding: 8px 20px;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    transition: all 0.2s;
  }

  .account-btn:hover {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* ============================================================
     主内容区（复刻截图设计）
     ============================================================ */
  .main-content {
    flex: 1;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 40px;
  }

  /* 超大标题 */
  .hero-title {
    font-size: clamp(48px, 8vw, 120px);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.1;
    padding-bottom: 30px;
    border-bottom: 1.5px solid var(--line); /* 截图中的细灰线 */
    word-break: break-word;
  }

  .hero-desc {
    margin-top: 30px;
    font-size: 15px;
    color: var(--muted);
    max-width: 36em;
    line-height: 1.6;
  }

  /* 白底黑字、楷体按钮 */
  .query-btn {
    margin-top: 50px;
    display: inline-block;
    font-family: var(--kai);
    font-size: 22px;
    letter-spacing: 0.15em;
    text-indent: 0.15em;
    padding: 16px 50px;
    background: var(--paper);
    color: var(--ink);
    border: 1.5px solid var(--ink);
    transition: all 0.25s ease;
  }

  .query-btn:hover {
    background: var(--ink);
    color: var(--paper);
  }

  /* ============================================================
     查询面板
     ============================================================ */
  .query-panel {
    margin-top: 60px;
    padding-top: 40px;
    border-top: 1.5px solid var(--ink);
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 30px;
  }

  .panel-title {
    font-size: 16px;
    font-weight: 700;
  }

  .panel-close {
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: none;
  }

  .panel-close:hover {
    color: var(--ink);
  }

  .query-form {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 40px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .input-group label {
    font-size: 12px;
    color: var(--muted);
  }

  .input-group input {
    width: 160px;
    font-family: var(--sans);
    font-size: 28px;
    font-weight: 700;
    padding: 5px 0;
    border: none;
    border-bottom: 1.5px solid var(--ink);
    background: transparent;
    outline: none;
  }

  .input-group input::placeholder {
    color: #ccc;
    font-weight: 400;
  }

  .submit-btn {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 14px 36px;
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--ink);
    transition: all 0.2s;
  }

  .submit-btn:hover {
    background: var(--paper);
    color: var(--ink);
  }

  /* 结果区 */
  .result-area {
    margin-top: 50px;
  }

  .result-block {
    margin-bottom: 40px;
  }

  .result-header {
    display: flex;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1.5px solid var(--ink);
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 20px;
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    padding: 20px 0;
    border-bottom: 1px solid var(--line);
  }

  .row-rank {
    font-size: 26px;
    font-weight: 800;
  }

  .row-tag {
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 4px 12px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }

  .stat-box {
    background: var(--paper);
    padding: 20px;
  }

  .stat-num {
    font-size: 36px;
    font-weight: 800;
    line-height: 1;
  }

  .stat-lbl {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }

  /* ============================================================
     弹窗系统（账号管理）
     ============================================================ */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(5px);
  }
  
  .modal[hidden] {
    display: none;
  }

  .modal-content {
    width: 100%;
    max-width: 480px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    padding: 40px;
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 15px;
    right: 15px;
    font-size: 24px;
    background: none;
    border: none;
    line-height: 1;
  }

  .modal-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .modal-desc {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 30px;
  }

  .form-row {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }

  .form-row span {
    width: 70px;
    font-size: 13px;
    color: var(--muted);
  }

  .form-row input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    font-weight: 600;
    background: transparent;
  }

  .modal-btn {
    width: 100%;
    margin-top: 30px;
    padding: 14px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  /* 轻提示 */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    padding: 12px 24px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 4px;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .toast.show { opacity: 1; }

  /* 响应式 */
  @media (max-width: 600px) {
    .topbar { padding: 20px; }
    .main-content { padding: 40px 20px; }
    .query-form { gap: 30px; flex-direction: column; align-items: flex-start; }
    .input-group input { width: 100%; }
    .modal-content { padding: 30px 20px; margin: 20px; }
  }
</style>
</head>

<body>

<!-- 顶部 -->
<header class="topbar">
  <div class="brand">xiaolishenbei.score.check</div>
  <button class="account-btn" id="btnOpenAccount">登录</button>
</header>

<!-- 主内容 -->
<main class="main-content">
  <!-- 超大标题 -->
  <h1 class="hero-title">你好，<span id="displayName">访客</span></h1>
  
  <p class="hero-desc">选择年份与月份，即可查询你在小力神杯足球赛挑战赛中的名次，并查看各项等级成绩的累计总成绩。</p>
  
  <button class="query-btn" id="btnShowQuery">查询我的成绩</button>

  <!-- 查询面板（默认隐藏） -->
  <div class="query-panel" id="queryPanel" hidden>
    <div class="panel-head">
      <div class="panel-title">成绩查询</div>
      <button class="panel-close" id="btnCloseQuery">收起 ↑</button>
    </div>
    
    <form class="query-form" id="formQuery">
      <div class="input-group">
        <label>年份</label>
        <input type="number" id="inputYear" placeholder="2024" min="2000" max="2100" required />
      </div>
      <div class="input-group">
        <label>月份</label>
        <input type="number" id="inputMonth" placeholder="12" min="1" max="12" required />
      </div>
      <button type="submit" class="submit-btn">查询</button>
    </form>

    <div class="result-area" id="resultArea"></div>
  </div>
</main>

<!-- ================= 弹窗区域 ================= -->

<!-- 登录/注册弹窗 -->
<div class="modal" id="authModal" hidden>
  <div class="modal-content">
    <button class="modal-close" onclick="document.getElementById('authModal').hidden = true">×</button>
    <h2 class="modal-title" id="authTitle">登录</h2>
    <p class="modal-desc" id="authDesc">使用账号和密码登录，查看你的比赛成绩。</p>
    
    <form id="formAuth">
      <!-- 注册时才显示的姓名输入 -->
      <div class="form-row" id="rowName" hidden>
        <span>姓名</span>
        <input type="text" id="authName" placeholder="请输入真实姓名" />
      </div>
      <div class="form-row">
        <span>账号</span>
        <input type="text" id="authAccount" placeholder="例如：3 / loveWCA" required />
      </div>
      <div class="form-row">
        <span>密码</span>
        <input type="password" id="authPassword" placeholder="请输入密码" required />
      </div>
      <button type="submit" class="modal-btn" id="authSubmitBtn">登录</button>
    </form>
    
    <p style="margin-top: 20px; font-size: 13px; text-align: center; color: var(--muted);">
      <span id="authSwitchText">还没有账号？</span>
      <a href="javascript:void(0)" id="btnSwitchAuth" style="color: var(--ink); font-weight: 700;">立即注册</a>
    </p>
  </div>
</div>

<!-- 账号管理弹窗 -->
<div class="modal" id="manageModal" hidden>
  <div class="modal-content">
    <button class="modal-close" onclick="document.getElementById('manageModal').hidden = true">×</button>
    <h2 class="modal-title">账号管理</h2>
    
    <div style="margin: 30px 0;">
      <div class="form-row"><span>账号</span><strong id="infoAccount">—</strong></div>
      <div class="form-row"><span>姓名</span><strong id="infoName">—</strong></div>
      <div class="form-row"><span>邮箱</span><span style="font-size: 13px; font-weight: 600;" id="infoEmail">—</span></div>
    </div>

    <button class="modal-btn" id="btnLogout" style="background: var(--paper); color: var(--ink); border: 1px solid var(--ink);">退出登录</button>
    <button class="modal-btn" id="btnChangePwd" style="background: var(--line); color: var(--ink); border: none; margin-top: 10px;">修改密码（演示入口）</button>
  </div>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ================================================================
   ① Supabase 配置区（填入你的 URL 和 anon key）
   ================================================================ */
const SUPABASE_URL      = 'https://YOUR-PROJECT.supabase.co';   
const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY';                      
const EMAIL_SUFFIX      = '@xiaolishen.local';

// 初始化 Supabase（如果未填写，则使用演示模式）
let sb = null;
if (!SUPABASE_URL.includes('YOUR-PROJECT') && window.supabase) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

/* ================================================================
   ② 基础工具
   ================================================================ */
const $ = (id) => document.getElementById(id);
const accountToEmail = (acc) => `${acc.trim()}${EMAIL_SUFFIX}`;

let currentUser = null;

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 2000);
}

/* ================================================================
   ③ UI 交互：查询面板
   ================================================================ */
$('btnShowQuery').onclick = () => {
  if (!sb) return toast('请先在代码顶部配置 Supabase 数据库');
  if (!currentUser) {
    $('authModal').hidden = false;
    return toast('请先登录账号');
  }
  $('queryPanel').hidden = false;
  $('queryPanel').scrollIntoView({ behavior: 'smooth' });
};

$('btnCloseQuery').onclick = () => {
  $('queryPanel').hidden = true;
};

/* ================================================================
   ④ UI 交互：登录 / 注册切换
   ================================================================ */
let isRegisterMode = false;

$('btnOpenAccount').onclick = () => {
  if (currentUser) {
    $('manageModal').hidden = false;
  } else {
    $('authModal').hidden = false;
  }
};

$('btnSwitchAuth').onclick = () => {
  isRegisterMode = !isRegisterMode;
  if (isRegisterMode) {
    $('authTitle').textContent = '注册账号';
    $('authDesc').textContent = '创建新账号，注册后自动登录。';
    $('rowName').hidden = false;
    $('authName').required = true;
    $('authSubmitBtn').textContent = '注册并登录';
    $('authSwitchText').textContent = '已有账号？';
    $('btnSwitchAuth').textContent = '返回登录';
  } else {
    $('authTitle').textContent = '登录';
    $('authDesc').textContent = '使用账号和密码登录，查看你的比赛成绩。';
    $('rowName').hidden = true;
    $('authName').required = false;
    $('authSubmitBtn').textContent = '登录';
    $('authSwitchText').textContent = '还没有账号？';
    $('btnSwitchAuth').textContent = '立即注册';
  }
};

/* ================================================================
   ⑤ 逻辑：认证提交
   ================================================================ */
$('formAuth').onsubmit = async (e) => {
  e.preventDefault();
  if (!sb) return toast('请先配置 Supabase');

  const acc = $('authAccount').value.trim();
  const pwd = $('authPassword').value;
  const name = $('authName').value.trim();

  if (isRegisterMode) {
    if (!name) return toast('请输入姓名');
    if (pwd.length < 6) return toast('密码至少 6 位');
    
    // 注册
    const { error: upErr } = await sb.auth.signUp({
      email: accountToEmail(acc), 
      password: pwd,
      options: { data: { account: acc, name } }
    });
    if (upErr) return toast('注册失败：' + upErr.message);

    // 自动登录
    const { data: login, error: loginErr } = await sb.auth.signInWithPassword({
      email: accountToEmail(acc), password: pwd
    });
    if (loginErr) return toast('自动登录失败：' + loginErr.message);
    
    currentUser = login.user;
    toast('注册成功');
  } else {
    // 登录
    const { data, error } = await sb.auth.signInWithPassword({
      email: accountToEmail(acc), password: pwd
    });
    if (error) return toast('登录失败：账号或密码错误');
    
    currentUser = data.user;
    toast('登录成功');
  }

  $('authModal').hidden = true;
  $('formAuth').reset();
  updateUserUI();
};

/* ================================================================
   ⑥ 逻辑：账号管理 & 退出
   ================================================================ */
$('btnLogout').onclick = async () => {
  if (sb) await sb.auth.signOut();
  currentUser = null;
  $('manageModal').hidden = true;
  toast('已退出登录');
  updateUserUI();
};

function updateUserUI() {
  if (currentUser) {
    const name = currentUser.user_metadata?.name || currentUser.email.split('@')[0];
    const acc  = currentUser.user_metadata?.account || currentUser.email.split('@')[0];
    
    $('displayName').textContent = name;
    $('btnOpenAccount').textContent = '账号';
    
    $('infoAccount').textContent = acc;
    $('infoName').textContent = name;
    $('infoEmail').textContent = currentUser.email;
  } else {
    $('displayName').textContent = '访客';
    $('btnOpenAccount').textContent = '登录';
  }
}

/* ================================================================
   ⑦ 逻辑：成绩查询与渲染
   ================================================================ */
$('formQuery').onsubmit = async (e) => {
  e.preventDefault();
  if (!currentUser) return toast('请先登录');

  const year = parseInt($('inputYear').value);
  const month = parseInt($('inputMonth').value);
  const resultArea = $('resultArea');

  resultArea.innerHTML = '<p style="color:var(--muted); font-size:14px;">查询中...</p>';

  try {
    // 1. 查明细
    const { data: scores, error: err1 } = await sb.from('scores')
      .select('*')
      .eq('user_id', currentUser.id)
      .eq('year', year)
      .eq('month', month);
    if (err1) throw err1;

    // 2. 查汇总
    const { data: totals, error: err2 } = await sb.from('totals')
      .select('*')
      .eq('user_id', currentUser.id)
      .maybeSingle();
    if (err2) throw err2;

    renderResult(year, month, scores, totals || {});
  } catch (err) {
    resultArea.innerHTML = `<p style="color:red; font-size:14px;">查询出错：${err.message}</p>`;
  }
};

function renderResult(year, month, scores, t) {
  const forms = { 0:'年度', 1:'季度', 2:'月度' };
  const ranks = ['冠军','亚军','季军','殿军','第5名'];
  
  // 转换 Totals 的 key
  const sums = {
    '冠军': t.champion || 0,
    '亚军': t.runner_up || 0,
    '季军': t.third || 0,
    '殿军': t.fourth || 0,
    '第5名': t.fifth || 0
  };
  const totalCount = ranks.reduce((a, k) => a + sums[k], 0);

  let html = `
    <div class="result-block">
      <div class="result-header">
        <span>查询结果</span>
        <span style="color:var(--muted); font-weight:400;">${year} 年 ${month} 月</span>
      </div>
  `;

  if (!scores || scores.length === 0) {
    html += `<p style="color:var(--muted); font-size:14px; padding:20px 0;">该月份暂无成绩记录。</p>`;
  } else {
    scores.forEach(s => {
      html += `
        <div class="result-row">
          <span class="row-rank">${s.rank}</span>
          <span class="row-tag">${forms[s.form] || '—'}</span>
        </div>
      `;
    });
  }
  html += `</div>`;

  // 渲染总成绩
  html += `
    <div class="result-block">
      <div class="result-header">
        <span>总成绩统计</span>
        <span style="color:var(--muted); font-weight:400;">全部赛事累计</span>
      </div>
      <div class="stats-grid">
        ${ranks.map(k => `
          <div class="stat-box">
            <div class="stat-num">${sums[k]}</div>
            <div class="stat-lbl">${k}</div>
          </div>
        `).join('')}
        <div class="stat-box">
          <div class="stat-num">${totalCount}</div>
          <div class="stat-lbl">合计</div>
        </div>
      </div>
    </div>
  `;

  $('resultArea').innerHTML = html;
}

/* ================================================================
   ⑧ 初始化
   ================================================================ */
(async function init() {
  // 设置输入框的默认提示
  $('inputYear').placeholder = new Date().getFullYear();
  $('inputMonth').placeholder = new Date().getMonth() + 1;

  if (sb) {
    const { data: { session } } = await sb.auth.getSession();
    currentUser = session?.user || null;
    
    sb.auth.onAuthStateChange((_event, session) => {
      currentUser = session?.user || null;
      updateUserUI();
    });
  }
  updateUserUI();
})();
</script>
</body>
</html>
